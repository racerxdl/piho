syntax = "proto3";

import "nanopb.proto";

message Empty {
}

message IndexedValue {
  uint32 index = 1;
  uint32 value = 2;
}

message ResetCommand {
  uint32 device = 1;
  bool broadcast = 2;
}

message TriggerCommand {
  uint32 input_device = 1;
  uint32 input_pin = 2;
  uint32 output_device = 3;
  uint32 output_pin = 4;
}

message DeviceCommand {
  uint32 device = 1;
}

message GraphBeginCommand {
  uint32 transfer_id = 1;
  uint32 generation = 2;
  uint32 image_size = 3;
  uint32 format = 4;
  uint32 executor_api = 5;
  uint32 expected_devices = 6;
  uint32 checksum = 7;
}

message GraphChunkCommand {
  uint32 transfer_id = 1;
  uint32 sequence = 2;
  bytes data = 3 [(nanopb).max_size = 4];
}

message GraphFinishCommand {
  uint32 transfer_id = 1;
  uint32 sequence_count = 2;
}

message GraphTransferCommand {
  uint32 transfer_id = 1;
}

message GraphIdentityCommand {
  uint32 generation = 1;
  uint32 checksum = 2;
}

message GraphStatusCommand {
  uint32 transfer_id = 1;
}

message HostCommand {
  oneof command {
    Empty health_check = 1;
    IndexedValue set_pin = 2;
    IndexedValue set_byte = 3;
    ResetCommand reset = 4;
    Empty status = 5;
    TriggerCommand upsert_trigger = 6;
    TriggerCommand remove_trigger = 7;
    DeviceCommand clear_triggers = 8;
    GraphBeginCommand graph_begin = 9;
    GraphChunkCommand graph_chunk = 10;
    GraphFinishCommand graph_finish = 11;
    GraphTransferCommand graph_abort = 12;
    Empty graph_activate = 13;
    GraphIdentityCommand graph_rollback = 14;
    GraphStatusCommand graph_status = 15;
  }
}

message InputStateEvent {
  uint32 device = 1;
  uint32 state = 2;
}

message StatusEvent {
  uint32 device = 1;
  bool input_device = 2;
  uint32 gpio_state = 3;
  uint32 trigger_count = 4;
  uint32 rx_dropped = 5;
  uint32 tx_dropped = 6;
  uint32 bus_errors = 7;
}

enum GraphUpdateState {
  GRAPH_UPDATE_STATE_IDLE = 0;
  GRAPH_UPDATE_STATE_RECEIVING = 1;
  GRAPH_UPDATE_STATE_VALIDATING = 2;
  GRAPH_UPDATE_STATE_STAGED = 3;
  GRAPH_UPDATE_STATE_ACTIVE = 4;
  GRAPH_UPDATE_STATE_ROLLBACK = 5;
  GRAPH_UPDATE_STATE_REJECTED = 6;
}

enum GraphUpdateError {
  GRAPH_UPDATE_ERROR_NONE = 0;
  GRAPH_UPDATE_ERROR_CONFLICT = 1;
  GRAPH_UPDATE_ERROR_INVALID_DESCRIPTOR = 2;
  GRAPH_UPDATE_ERROR_STALE_GENERATION = 3;
  GRAPH_UPDATE_ERROR_STORAGE = 4;
  GRAPH_UPDATE_ERROR_OUT_OF_ORDER = 5;
  GRAPH_UPDATE_ERROR_CONFLICTING_CHUNK = 6;
  GRAPH_UPDATE_ERROR_MISSING_CHUNK = 7;
  GRAPH_UPDATE_ERROR_INVALID_IMAGE = 8;
  GRAPH_UPDATE_ERROR_TIMEOUT = 9;
  GRAPH_UPDATE_ERROR_NOT_STAGED = 10;
  GRAPH_UPDATE_ERROR_NOT_READY = 11;
  GRAPH_UPDATE_ERROR_SEND_FAILED = 12;
  GRAPH_UPDATE_ERROR_ABORTED = 13;
}

message GraphUpdateEvent {
  uint32 transfer_id = 1;
  uint32 generation = 2;
  uint32 checksum = 3;
  uint32 expected_devices = 4;
  uint32 ready_devices = 5;
  uint32 progressed_devices = 6;
  uint32 staged_devices = 7;
  uint32 rejected_devices = 8;
  uint32 active_devices = 9;
  uint32 rollback_devices = 10;
  uint32 missing_devices = 11;
  uint32 next_sequence = 12;
  uint32 sequence_count = 13;
  GraphUpdateState state = 14;
  GraphUpdateError error = 15;
  bool chunk_pending = 16;
}

message ErrorEvent {
  enum Code {
    UNKNOWN = 0;
    INVALID_FRAME = 1;
    INVALID_COMMAND = 2;
    OUT_OF_RANGE = 3;
    TRANSPORT = 4;
    STORAGE = 5;
    TRIGGER_TABLE_FULL = 6;
    GRAPH_UPDATE = 7;
  }

  Code code = 1;
}

message AckEvent {
  enum Operation {
    NONE = 0;
    HEALTH_CHECK = 1;
    SET_PIN = 2;
    SET_BYTE = 3;
    RESET = 4;
    UPSERT_TRIGGER = 5;
    REMOVE_TRIGGER = 6;
    CLEAR_TRIGGERS = 7;
    GRAPH_BEGIN = 8;
    GRAPH_CHUNK = 9;
    GRAPH_FINISH = 10;
    GRAPH_ABORT = 11;
    GRAPH_ACTIVATE = 12;
    GRAPH_ROLLBACK = 13;
    GRAPH_STATUS = 14;
  }

  Operation operation = 1;
  bool accepted = 2;
}

message DeviceEvent {
  oneof event {
    InputStateEvent input_state = 1;
    StatusEvent status = 2;
    ErrorEvent error = 3;
    AckEvent ack = 4;
    GraphUpdateEvent graph_update = 5;
  }
}
